name: MediCare CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-check:
    name: Backend syntax check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend dependencies
        working-directory: Back-end
        run: npm ci

      - name: Check backend JavaScript syntax
        working-directory: Back-end
        run: node --check server.js

  frontend-check:
    name: Frontend build and lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend dependencies
        working-directory: Front-end
        run: npm ci

      - name: Build frontend
        working-directory: Front-end
        run: npm run build

      - name: Lint frontend
        working-directory: Front-end
        run: npm run lint
